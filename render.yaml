# Render Blueprint for CS2 AI COACH (spec §68–§70).
#
# Free-tier allocation:
#   1 × Web Service    → cs2coach-api (Fastify backend)
#   1 × Background Worker → cs2coach-bot (grammY long-polling)
#   Static Site        → cs2coach-frontend (created manually in dashboard)
#
# The frontend is NOT in this Blueprint because Render Blueprints don't support
# the static_site type. Create it manually:
#   New + → Static Site → GitHub → repo: JASCOJI123/cs2coach
#   Root Dir: apps/web | Build: npm ci && npm run build | Publish: dist
#
#   Postgres: Neon Free (set DATABASE_URL in the API env group).
#
services:
  - type: web
    name: cs2coach-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    healthCheckPath: /health
    buildCommand: npm ci && npm run build
    startCommand: node apps/api/dist/server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGINS
        sync: false # set in dashboard: https://cs2coach-frontend.onrender.com
      - key: SESSION_SECRET
        sync: false # strong random value
      - key: DATABASE_URL
        sync: false # Neon Free connection string (sslmode=require)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        sync: false
      - key: FACEIT_API_KEY
        sync: false
      - key: FACEIT_CLIENT_ID
        sync: false
      - key: FACEIT_CLIENT_SECRET
        sync: false
      - key: FACEIT_REDIRECT_URI
        sync: false
      - key: FACEIT_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: worker
    name: cs2coach-bot
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: node bot/dist/bot.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        sync: false

# UptimeRobot (spec §69): add an HTTPS monitor against
# https://cs2coach-api.onrender.com/health every 5 min so the free API
# stays warm and doesn't sleep after 15 min of inactivity.