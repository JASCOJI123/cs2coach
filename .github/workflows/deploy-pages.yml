name: Deploy Mini App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Mini App
        run: npm run build:web
        env:
          VITE_API_URL: https://cs2coach-api.onrender.com

      # Keep the normal URL and publish the same build under a versioned path.
      # Telegram clients can cache the Mini App entry URL aggressively, so the
      # bot will use /cs2coach/v2/ to force a fresh document without changing
      # the app's runtime behavior.
      - name: Publish versioned Mini App path
        run: |
          mkdir -p apps/web/dist/v2
          cp -R apps/web/dist/assets apps/web/dist/v2/
          cp apps/web/dist/index.html apps/web/dist/v2/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
